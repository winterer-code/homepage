# _cases 폴더에 사례(.md)를 올리거나 고치면 자동으로
# 상세 페이지·업무사례 목록·메인 슬라이더·sitemap.xml 을 다시 만들어 반영합니다.
name: 업무사례 자동 반영

on:
  push:
    branches: [main]
    paths:
      - "_cases/**"
      - "_tools/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-cases
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install markdown pyyaml

      - name: 업무사례 페이지 생성
        run: python _tools/build_cases.py

      - name: 변경 사항 반영
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "바뀐 페이지가 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "업무사례 페이지 자동 생성"
          git push
          # 봇이 올린 변경도 사이트에 바로 배포되도록 Pages 빌드를 요청
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
